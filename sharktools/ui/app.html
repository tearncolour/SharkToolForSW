<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharkTools 控制面板</title>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- Ant Design 图标 -->
    <link rel="stylesheet" href="https://unpkg.com/@mdi/font@7.4.47/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app" class="ant-app">
        <!-- 主页面 -->
        <div v-if="currentPage === 'main'" class="main-container">
            <!-- 头部卡片 -->
            <div class="ant-card header-card">
                <div class="header-content">
                    <div class="logo-wrapper">
                        <img src="logo.png" alt="SharkTools" class="logo-img" />
                    </div>
                    <div class="header-text">
                        <h1 class="app-title">SharkTools</h1>
                        <p class="app-subtitle">SOLIDWORKS 智能工具套件</p>
                    </div>
                </div>
                <div class="launch-btn-wrapper">
                    <button class="ant-btn ant-btn-primary ant-btn-lg launch-btn" @click="launchClient">
                        <span class="anticon mdi mdi-rocket-launch"></span>
                        <span>启动桌面客户端</span>
                    </button>
                </div>
            </div>

            <!-- 用户信息卡片 -->
            <transition name="fade">
                <div class="ant-card user-card" :key="isLoggedIn">
                    <div class="user-info">
                        <div class="ant-avatar ant-avatar-lg user-avatar" :class="{ 'has-img': avatarUrl }">
                            <img v-if="avatarUrl" :src="avatarUrl" :alt="userName" />
                            <span v-else class="avatar-text">{{ userInitial }}</span>
                        </div>
                        <div class="user-details">
                            <div class="user-name">{{ displayName }}</div>
                            <div class="user-status">
                                <span class="ant-tag" :class="isLoggedIn ? 'ant-tag-success' : 'ant-tag-default'">
                                    <span class="status-dot" :class="isLoggedIn ? 'online' : 'offline'"></span>
                                    {{ isLoggedIn ? '在线' : '离线' }}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </transition>

            <!-- 功能按钮区域 -->
            <div class="ant-card actions-card">
                <div class="card-header">
                    <span class="anticon mdi mdi-tools header-icon"></span>
                    <span class="header-title">快捷功能</span>
                </div>
                
                <div class="button-group">
                    <button class="ant-btn ant-btn-primary btn-action" @click="sayHello" :disabled="loading">
                        <span class="anticon mdi mdi-shark"></span>
                        <span v-if="!loading">打招呼</span>
                        <span v-else class="ant-btn-loading-icon">
                            <span class="anticon anticon-loading anticon-spin mdi mdi-loading"></span>
                        </span>
                    </button>

                    <button class="ant-btn btn-action btn-info" @click="openHistory">
                        <span class="anticon mdi mdi-clipboard-text-clock"></span>
                        <span>历史记录</span>
                    </button>

                    <button class="ant-btn btn-action btn-warning" @click="optimizePerformance" :disabled="optimizing">
                        <span class="anticon mdi mdi-lightning-bolt"></span>
                        <span v-if="!optimizing">优化性能</span>
                        <span v-else class="ant-btn-loading-icon">
                            <span class="anticon anticon-loading anticon-spin mdi mdi-loading"></span>
                        </span>
                    </button>

                    <button v-if="!isLoggedIn" class="ant-btn btn-action btn-dark" @click="toggleLoginForm">
                        <span class="anticon mdi mdi-github"></span>
                        <span>登录 GitHub</span>
                    </button>
                    
                    <button v-if="isLoggedIn" class="ant-btn ant-btn-dangerous btn-action" @click="logout">
                        <span class="anticon mdi mdi-logout"></span>
                        <span>退出登录</span>
                    </button>
                </div>

                <!-- 登录表单 -->
                <transition name="slide-fade">
                    <div v-if="showLoginForm" class="login-form">
                        <div class="ant-divider">
                            <span class="ant-divider-inner-text">GitHub 登录</span>
                        </div>
                        <div class="ant-form-item">
                            <label class="ant-form-item-label">
                                <span class="anticon mdi mdi-key"></span>
                                Personal Access Token
                            </label>
                            <div class="ant-input-affix-wrapper">
                                <span class="ant-input-prefix">
                                    <span class="anticon mdi mdi-lock"></span>
                                </span>
                                <input 
                                    type="password" 
                                    class="ant-input" 
                                    v-model="token"
                                    placeholder="ghp_xxxxxxxxxxxxxxxxxxxx"
                                    @keyup.enter="login"
                                />
                            </div>
                        </div>
                        <div class="form-actions">
                            <button class="ant-btn ant-btn-primary" @click="login" :disabled="loading || !token.trim()">
                                <span class="anticon mdi mdi-check"></span>
                                <span v-if="!loading">确认登录</span>
                                <span v-else>登录中...</span>
                            </button>
                            <button class="ant-btn" @click="cancelLogin">
                                <span class="anticon mdi mdi-close"></span>
                                取消
                            </button>
                        </div>
                    </div>
                </transition>
            </div>

            <!-- 版本信息 -->
            <div class="version-info">
                <span class="anticon mdi mdi-information-outline"></span>
                SharkTools v1.0.0
            </div>
        </div>

        <!-- 历史记录页面 -->
        <div v-if="currentPage === 'history'" class="history-page">
            <div class="ant-card history-header-card">
                <button class="ant-btn ant-btn-text" @click="goBackToMain">
                    <span class="anticon mdi mdi-arrow-left"></span>
                    <span>返回</span>
                </button>
                <h2 class="history-title">
                    <span class="anticon mdi mdi-history"></span>
                    历史记录
                </h2>
            </div>
            
            <div class="ant-card history-content-card">
                <div class="ant-empty">
                    <div class="ant-empty-image">
                        <span class="anticon mdi mdi-chart-timeline-variant" style="font-size: 64px; color: #d9d9d9;"></span>
                    </div>
                    <p class="ant-empty-description">历史记录加载中...</p>
                    <p class="ant-empty-footer">时间轴功能开发中</p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
